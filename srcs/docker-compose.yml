services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: on-failure

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

    secrets:
      - db_password
      - db_root_password

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - inception


  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    restart: on-failure

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      DOMAIN_NAME: ${DOMAIN_NAME}

    depends_on:
      - mariadb

    secrets:
      - db_password
      - credentials

    volumes:
      - wp_data:/var/www/html

    networks:
      - inception


  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx
    restart: on-failure

    depends_on:
      - wordpress

    ports:
      - "443:443"

    volumes:
      - wp_data:/var/www/html

    networks:
      - inception


secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  credentials:
    file: ../secrets/credentials.txt


volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/anguenda/data/db

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/anguenda/data/wordpress


networks:
  inception:
    driver: bridge